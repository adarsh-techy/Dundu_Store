services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dundu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dundu}
      POSTGRES_DB: ${POSTGRES_DB:-dundu_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to localhost only: the API reaches Postgres over the compose network, and the
    # database must never be reachable from the internet with these credentials.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dundu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      # POSTGRES_PASSWORD is interpolated raw into this URL: use letters/digits only (no @ # / % ?).
      DATABASE_URL: postgresql://${POSTGRES_USER:-dundu}:${POSTGRES_PASSWORD:-dundu}@postgres:5432/${POSTGRES_DB:-dundu_db}
      WEB_CLIENT_URL: ${WEB_CLIENT_URL:-http://localhost:3000}
      ADMIN_CLIENT_URL: ${ADMIN_CLIENT_URL:-http://localhost:3001}
      SUPER_ADMIN_CLIENT_URL: ${SUPER_ADMIN_CLIENT_URL:-}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${WEB_VITE_API_BASE_URL:-}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_SUPPORT_WHATSAPP: ${VITE_SUPPORT_WHATSAPP:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE_URL: ${ADMIN_VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
