# Render Blueprint — creates the Postgres database and the Dundu API in one click.
# Dashboard → New + → Blueprint → select this repo → Apply.
databases:
  - name: dundu-db
    plan: free
    region: singapore
    databaseName: dundu
    user: dundu

services:
  - type: web
    name: dundu-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: DATABASE_URL
        fromDatabase:
          name: dundu-db
          property: connectionString # auto-wired; change later in Environment if you move the DB
      - key: WEB_CLIENT_URL
        value: https://dundu-web.vercel.app     # update after Vercel deploy
      - key: ADMIN_CLIENT_URL
        value: https://dundu-admin.vercel.app   # update after Vercel deploy
      - key: GOOGLE_CALLBACK_URL
        value: https://dundu-api.onrender.com/api/auth/google/callback
      - key: TWILIO_WHATSAPP_FROM
        value: "whatsapp:+14155238886"
      # Fill these in the Render dashboard when you have them (Environment tab):
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
